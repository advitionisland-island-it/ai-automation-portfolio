name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: projects/p01-lead-automation
        shell: bash
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sales_ops
          POSTGRES_PASSWORD: sales_ops
          POSTGRES_DB: sales_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sales_ops -d sales_ops_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sales_ops:sales_ops@127.0.0.1:5432/sales_ops_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          working-directory: projects/p01-lead-automation
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Scan all tracked repository files
        working-directory: .
        run: |
          mapfile -d '' files < <(git ls-files -z)
          projects/p01-lead-automation/scripts/check_secrets.sh "${files[@]}"
      - name: Test against PostgreSQL and Mailpit
        run: |
          mkdir -p test-results
          printf '%s\n' "$GITHUB_SHA" > test-results/commit.txt
          uv run pytest --junitxml=test-results/junit.xml | tee test-results/pytest.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p01-tests-${{ github.sha }}
          path: projects/p01-lead-automation/test-results/
          if-no-files-found: warn
