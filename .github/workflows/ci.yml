# Defined in M0, runs only after the repository is pushed (UD-6). Not yet verified on GitHub.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sales_ops
          POSTGRES_PASSWORD: sales_ops
          POSTGRES_DB: sales_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sales_ops -d sales_ops_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sales_ops:sales_ops@127.0.0.1:5432/sales_ops_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: scripts/check_secrets.sh
      - run: uv run pytest
